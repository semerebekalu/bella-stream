[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA fallback so invite links like /?room=abc work on refresh.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Optional headers for a cleaner production client.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
